name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, publish nothing
        type: boolean
        default: true
      changelog:
        description: Changelog for every skill in this release
        type: string
        default: ""

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    # Pinned to a reviewed commit of openclaw/clawhub; update the SHA deliberately.
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@6e6c57d1b681c7458ef1519b8fb0dc789801b5b2
    with:
      root: skills
      skill_path: skills/dsers-dropshipping
      # Category slugs are fixed by ClawHub; topics are free-form, at most 5.
      categories: finance,productivity
      topics: dropshipping,dropship,dropshipper,shopify,aliexpress
      dry_run: ${{ inputs.dry_run }}
      changelog: ${{ inputs.changelog }}
      owner: ${{ vars.CLAWHUB_OWNER }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
